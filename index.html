<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lehmann 1938 — Vienna Address Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<header id="bar">
  <div id="title">Lehmann <b>1938</b> · Vienna</div>
  <div id="searchwrap">
    <input id="search" type="search" placeholder="Surname, street, occupation…" autocomplete="off">
    <div id="results"></div>
  </div>
  <select id="quality" title="Geocoding match quality">
    <option value="2">All pins</option>
    <option value="1">Registry or better</option>
    <option value="0">Exact only</option>
  </select>
</header>
<div id="status"><span id="count"></span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
